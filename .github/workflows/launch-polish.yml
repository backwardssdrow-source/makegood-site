name: One-time launch review
on:
  push:
    branches: [site-launch-polish-20261013]
    paths: ['.github/launch_polish.py', '.github/qa-mode']
permissions:
  contents: write
jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: site-launch-polish-20261013
      - name: Install browser test dependencies
        run: |
          python3 -m pip install beautifulsoup4==4.14.3 playwright==1.57.0
          python3 -m playwright install --with-deps chromium
      - name: Prepare or verify the approved launch changes
        run: python3 .github/launch_polish.py
      - name: Save reviewed production files on the review branch
        if: success()
        run: |
          if [ ! -f .github/qa-mode ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add '*.html' 'services/*.html' site.css site-manifest.json sitemap.xml robots.txt makegood-social.png README.md
            if ! git diff --cached --quiet; then
              git commit -m 'Prepare approved launch copy, search visibility, and sharing image'
              git push origin HEAD:site-launch-polish-20261013
            fi
          fi
      - name: Save review screenshots and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: makegood-launch-qa
          path: .qa/
          include-hidden-files: true
          retention-days: 7
